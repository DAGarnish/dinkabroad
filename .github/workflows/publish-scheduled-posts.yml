# Publishes scheduled blog posts on their date.
#
# Every morning, any post in content/scheduled/ whose front matter `date:` is
# today or earlier is moved into content/blog/ and committed. The push makes
# Vercel redeploy the site, so the post goes live and joins the sitemap.
# Run it by hand from the Actions tab ("Run workflow") to publish early.
#
# Each published post also gets a GitHub issue mentioning @DAGarnish, so
# GitHub emails a notification with the post's title and link (user request,
# 2026-11-18: email garnish.ecom@gmail.com for all blog updates). The issue is
# closed straight away; it's only there to send the email.
name: Publish scheduled posts

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move due posts into content/blog
        id: move
        run: |
          today=$(date -u +%Y-%m-%d)
          moved=""
          shopt -s nullglob
          for file in content/scheduled/*.md; do
            date=$(grep -m1 '^date:' "$file" | sed 's/^date:[[:space:]]*//' | tr -d '"'"'"' \r')
            if [[ -n "$date" && ! "$date" > "$today" ]]; then
              mkdir -p content/blog
              git mv "$file" "content/blog/$(basename "$file")"
              moved="$moved $(basename "$file" .md)"
            fi
          done
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.move.outputs.moved != ''
        run: |
          git config user.name "DAG"
          git config user.email "garnish.ecom@gmail.com"
          git commit -m "Publish scheduled post:${{ steps.move.outputs.moved }}"
          git push

      - name: Email a notification for each published post
        if: steps.move.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for slug in ${{ steps.move.outputs.moved }}; do
            title=$(grep -m1 '^title:' "content/blog/$slug.md" | sed 's/^title:[[:space:]]*//')
            url="https://dinkabroad.com/blog/$slug"
            body=$(printf '@DAGarnish New blog post published on Dink Abroad:\n\n**%s**\n%s\n\nIt goes live once Vercel finishes deploying, usually within a couple of minutes.' "$title" "$url")
            number=$(gh issue create --title "Published: $title" --body "$body" | grep -o '[0-9]*$')
            gh issue close "$number" --reason completed
          done
